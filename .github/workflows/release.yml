name: Release

# v* タグ（例: v0.0.3）を push すると、そのタグと package.json の version が
# 一致することを確認したうえで、テスト・VSIX作成・GitHub Release への添付を行い、
# リポジトリシークレット VSCE_PAT が設定されていれば Marketplace へも公開する。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Check that the tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: xvfb-run -a npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run package
      - name: Create GitHub Release with the VSIX attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --generate-notes
      - name: Publish to the Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish -p "$VSCE_PAT" --packagePath *.vsix
